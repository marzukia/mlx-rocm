[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-rocm"
version = "0.1.0"
description = "ROCm backend for MLX (pre-alpha): vendored mlx ROCm backend tree + hipBLASLt GEMM + QMV decode kernels, validated on AMD RDNA4 (gfx1201)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Submitter", email = "submitter@example.org" }]
keywords = ["mlx", "rocm", "hip", "amd", "rdna4", "gfx1201"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
"mlx_rocm" = ["*.so", "*.so.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# np-rca-*.py = one-off RCA diagnostic probes (run-605/run-606, MTP norms fix).
# Kept byte-identical to as-run evidence; excluded from lint + format.
# bench/mtp-bench{3,5,6}.py, bench/mtp-bench3-side.py, bench/mtp-bench6-phase.py
# + bench/g1-t3-parts.py = as-run guest bench harness (run-612/run-631, audit
# run-638; mtp-bench3-side.py = the as-run fused-arm bench of the PR3-HYBRID
# 80.93 tok/s wheel; mtp-bench6.py = the K=3 arm, t1224/t1225; mtp-bench6-phase.py
# = the K=3 phase-timing harness, mtp-fix-round2, md5 608a7770); kept
# byte-identical to as-run evidence; excluded.
extend-exclude = [
    "np-rca-*.py",
    "bench/mtp-bench3.py",
    "bench/mtp-bench3-side.py",
    "bench/mtp-bench5.py",
    "bench/mtp-bench6.py",
    "bench/mtp-bench6-phase.py",
    "bench/g1-t3-parts.py",
    # T=2 fused-kernel development diagnostics (guest bisect/probe runs): kept as
    # as-run evidence; excluded from lint + format.
    "bench/component_check.py",
    "bench/conv_fma_check.py",
    "bench/dbg_cmp.py",
    "bench/dbg_cmp_t1.py",
    "bench/fix_bisect_snap.py",
    "bench/g_formula_check.py",
    "bench/gdn_fused_t2_probe.py",
    "bench/gdn_t2_bisect.py",
    "bench/op_t2_realvals.py",
    "bench/patch_bench_trace.py",
    "bench/t1t2_op_disc.py",
    "bench/window_bisect.py",
    # m8 full-state audit as-run probe scripts (run-942/run-976/run-986/run-992): kept
    # byte-identical to as-run evidence; excluded from lint + format.
    "scripts/m8-mtp148-bisect.py",
    "scripts/m8-state-audit.py",
    "scripts/m8-mtp-state-trace.py",
    "scripts/m8-sdpa-isolated.py",
    "scripts/m8-fa-bisect.py",
    "scripts/m7-probe1.py",
    "scripts/m7-probe2.py",
    "scripts/m7-probe3.py",
    "scripts/m7-probe4.py",
    "scripts/m7-probe5.py",
    "scripts/m7-state-probe.py",
    "scripts/m7-g4-probe.py",
    "scripts/m7-mtp-probe.py",
    "scripts/m7-mtp2-probe.py",
    "scripts/diag-s62-m5.py",
    "scripts/diag-s62-m7.py",
    "scripts/diag-s62-sdpa.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# R4 finding 1: reflowed prose in tests/test_gdn_fuse.py exceeds line-length by design; E501 ignored for it only.
[tool.ruff.lint.per-file-ignores]
"tests/test_gdn_fuse.py" = ["E501"]
# mtp-bench6-phase.py = instrumented phase-timing diagnostic (a copy of the
# as-run canonical mtp-bench6.py loop with per-region perf_counter wraps);
# keeps the canonical variable names (l/h/s) + percent formatting.
"bench/mtp-bench6-phase.py" = ["E501", "E741", "UP031", "SIM102", "F841"]
# mtp-traffic-audit.py = the traffic-audit measurement probe (t1582): mirrors the
# canonical mtp-bench6.py loop + module byte inventory; keeps the canonical
# variable names (l/h) + percent formatting.
"bench/mtp-traffic-audit.py" = ["E501", "E741", "UP031", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the ROCm GPU (runs on guest-a only; skipped in CI and off-GPU)",
    "hermetic: no GPU needed, runs anywhere",
]

# License note: the `license = { text = ... }` table is intentionally absent -
# uv 0.10.9 rejects the table form and setuptools 84 rejects the list form, so
# no single form satisfies both. MIT is declared via the classifier
# above + the LICENSE file (included in the sdist).
