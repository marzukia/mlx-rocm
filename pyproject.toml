[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-rocm"
version = "0.0.1"
description = "ROCm backend for MLX (MVP): vendored mlx ROCm backend tree + minimal hipBLASLt GEMM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "monkytheluffy", email = "monky@ag.mrzk.io" }]
keywords = ["mlx", "rocm", "hip", "amd", "rdna4", "gfx1201"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
"mlx_rocm" = ["*.so", "*.so.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# np-rca-*.py = one-off RCA diagnostic probes (t605/t606, MTP norms fix).
# Kept byte-identical to as-run evidence; excluded from lint + format.
# bench/mtp-bench{3,5}.py + bench/g1-t3-parts.py = as-run guest bench harness
# (t612/t631, audit t638); kept byte-identical to as-run evidence; excluded.
extend-exclude = [
    "np-rca-*.py",
    "bench/mtp-bench3.py",
    "bench/mtp-bench5.py",
    "bench/g1-t3-parts.py",
    # m8 full-state audit as-run probe scripts (t942/t976/t986/t992): kept
    # byte-identical to as-run evidence; excluded from lint + format.
    "scripts/m8-mtp148-bisect.py",
    "scripts/m8-state-audit.py",
    "scripts/m8-mtp-state-trace.py",
    "scripts/m8-sdpa-isolated.py",
    "scripts/m8-fa-bisect.py",
    "scripts/m7-probe1.py",
    "scripts/m7-probe2.py",
    "scripts/m7-probe3.py",
    "scripts/m7-probe4.py",
    "scripts/m7-probe5.py",
    "scripts/m7-state-probe.py",
    "scripts/m7-g4-probe.py",
    "scripts/m7-mtp-probe.py",
    "scripts/m7-mtp2-probe.py",
    "scripts/diag-s62-m5.py",
    "scripts/diag-s62-m7.py",
    "scripts/diag-s62-sdpa.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the ROCm GPU (runs on marzuki-neon only; skipped in CI and off-GPU)",
    "hermetic: no GPU needed, runs anywhere",
]

# License note: the `license = { text = ... }` table is intentionally absent -
# uv 0.10.9 rejects the table form and setuptools 84 rejects the list form, so
# no single form satisfies both. MIT is declared via the classifier
# above + the LICENSE file (included in the sdist).
