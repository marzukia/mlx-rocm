name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sdist + wheel
        run: uv build --out-dir dist

      - name: Guard - pyproject version must equal the tag (leading v stripped)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::refusing to publish: tag v$TAG does not match pyproject version $VER"
            exit 1
          fi

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: "${{ secrets.PYPI_API_TOKEN }}"
        run: uvx twine upload --non-interactive dist/*
